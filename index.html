<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reto de la Suerte</title>
  <meta name="description" content="Juego de probabilidades para grado 5: ruleta, dados y bolsas sorpresa. 5 preguntas nuevas en cada partida.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <main class="page">
    <header class="topbar">
      <a class="chip" href="juego1/">Juego 1 ➜</a>
      <div class="progress" id="progress" aria-label="Progreso"></div>
      <div class="score">⭐ <span id="score">0</span></div>
      <button class="chip" id="sound" type="button" aria-label="Sonido">🔊</button>
    </header>

    <!-- Start -->
    <section class="screen start" id="start">
      <div class="logo">
        <span class="logo-icons">🎡🎲🎒</span>
        <h1>Reto de la <em>Suerte</em></h1>
      </div>
      <p class="lead">5 preguntas de probabilidad. ¡Cada partida es diferente!</p>
      <button class="btn btn-big" id="play" type="button">¡Jugar!</button>
    </section>

    <!-- Question -->
    <section class="screen" id="quiz" hidden>
      <div class="qcard">
        <p class="qnum" id="qnum"></p>
        <h2 class="prompt" id="prompt"></h2>
        <div class="scene" id="scene"></div>
        <div class="options" id="options"></div>
        <div class="explain" id="explain" hidden></div>
        <button class="btn btn-big" id="next" type="button" hidden>Siguiente ➜</button>
      </div>
    </section>

    <!-- End -->
    <section class="screen end" id="end" hidden>
      <div class="stars" id="stars"></div>
      <h2 id="endTitle"></h2>
      <p class="lead" id="endText"></p>
      <button class="btn btn-big" id="again" type="button">🔁 Jugar otra vez</button>
    </section>

    <footer class="footer">Exposición de Estadística · Grado 5</footer>
  </main>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
